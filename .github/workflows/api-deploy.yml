name: API - Build and Deploy

on:
  push:
    branches: ["develop", "staging", "main"]
    paths:
      - "apps/api/**"
      - "infra/terraform/**"
      - ".github/workflows/api-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev

permissions:
  contents: read
  packages: write
  id-token: write

env:
  APP_NAME: rv-demo-api
  AWS_REGION: us-east-1
  IMAGE_NAME: ghcr.io/${{ github.repository }}/rv-demo-api

jobs:
  resolve-environment:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image_tag: ${{ steps.env.outputs.image_tag }}
      terraform_dir: ${{ steps.env.outputs.terraform_dir }}
    steps:
      - id: env
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ inputs.environment }}"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            ENVIRONMENT="prod"
          elif [[ "${{ github.ref_name }}" == "staging" ]]; then
            ENVIRONMENT="staging"
          else
            ENVIRONMENT="dev"
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${ENVIRONMENT}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "terraform_dir=infra/terraform/environments/${ENVIRONMENT}" >> "$GITHUB_OUTPUT"

  test:
    name: Test API
    runs-on: ubuntu-latest
    needs: resolve-environment
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: go build ./cmd/server

  build-image:
    name: Build and publish API image
    runs-on: ubuntu-latest
    needs: [resolve-environment, test]
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ needs.resolve-environment.outputs.image_tag }} \
            -t ${{ env.IMAGE_NAME }}:${{ needs.resolve-environment.outputs.environment }} \
            ./apps/api

      - name: Push image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ needs.resolve-environment.outputs.image_tag }}
          docker push ${{ env.IMAGE_NAME }}:${{ needs.resolve-environment.outputs.environment }}

      - id: meta
        run: echo "image_uri=${{ env.IMAGE_NAME }}:${{ needs.resolve-environment.outputs.image_tag }}" >> "$GITHUB_OUTPUT"

  terraform-plan:
    name: Terraform plan for API infrastructure
    runs-on: ubuntu-latest
    needs: [resolve-environment, build-image]
    environment: ${{ needs.resolve-environment.outputs.environment }}
    defaults:
      run:
        working-directory: ${{ needs.resolve-environment.outputs.terraform_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=rv-terraform-state-afoster" \
            -backend-config="key=rv-platform-demo/${{ needs.resolve-environment.outputs.environment }}/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan \
            -input=false \
            -var="image_tag=${{ needs.build-image.outputs.image_uri }}" \
            -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: api-tfplan-${{ needs.resolve-environment.outputs.environment }}
          path: ${{ needs.resolve-environment.outputs.terraform_dir }}/tfplan

  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [resolve-environment, build-image, terraform-plan]
    environment: ${{ needs.resolve-environment.outputs.environment }}
    defaults:
      run:
        working-directory: ${{ needs.resolve-environment.outputs.terraform_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=rv-terraform-state-afoster" \
            -backend-config="key=rv-platform-demo/${{ needs.resolve-environment.outputs.environment }}/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: api-tfplan-${{ needs.resolve-environment.outputs.environment }}
          path: ${{ needs.resolve-environment.outputs.terraform_dir }}

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Smoke test API
        run: |
          echo "Run environment-specific smoke tests here."
          echo "Example: curl -f https://api-${{ needs.resolve-environment.outputs.environment }}.example.com/healthz"
