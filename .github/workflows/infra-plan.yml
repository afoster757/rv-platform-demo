name: Infrastructure - Plan Only

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra-plan.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
      run_delete:
        description: "Run TF Delete"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: us-east-1

jobs:
  plan:
    name: Plan ${{ matrix.stack }} / ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', inputs.environment)) || fromJson('["dev", "staging", "prod"]') }}
        stack: ["core", "api"]
    environment: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.stack }}/${{ matrix.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=rv-terraform-state-afoster" \
            -backend-config="key=rv-platform-demo/${{ matrix.environment }}/${{ matrix.stack }}/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false

      - name: Terraform Delete
        run: terraform destroy -auto-approve
        if: inputs.run_delete == true
        
